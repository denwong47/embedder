name: embedder

services:
  convert-model:
    build:
      context: .
      dockerfile: docker/ConvertModel.Dockerfile
    image: denwong47/embedder-convert-model
    volumes:
      - ./models:/root/models

  build-binary:
    build:
      context: .
      dockerfile: docker/BuildFedora.Dockerfile
      target: build
    image: denwong47/embedder-build
    volumes:
      - .:/root/crate/embedder
      - ./target:/root/crate/embedder/target
    environment:
      - TARGET=x86_64-unknown-linux-gnu
      - BUILD_ARGS=--release --features=sentence_transformers,status
      - MODEL_PATH=/root/crate/embedder/models
      - PKG_CONFIG_SYSROOT_DIR=/

  build-host:
    extends:
      service: build-binary
    build:
      target: host
      args:
        - TARGET=x86_64-unknown-linux-gnu
        - BUILD_ARGS=--release --features=sentence_transformers,status
    image: denwong47/embedder-host
    ports:
      - "3456:3456"
